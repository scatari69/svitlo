[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "svitlo"
version = "0.1.0"
description = "Telegram electricity monitoring and planned outage schedules"
requires-python = ">=3.13"
dependencies = [
  "aiogram>=3.20,<4",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0.40,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.15,<2",
  "redis>=5.2,<8",
  "pydantic-settings>=2.8,<3",
  "httpx>=0.28,<1",
  "aiohttp>=3.14,<4",
  "cryptography>=44,<49",
  "pysnmp>=7.1,<8",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.26,<2", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
